# SwiftLint - version pinned in .mise.toml. Runs in `make lint` / `make check`
# (not as an Xcode build phase). SwiftFormat owns formatting; SwiftLint owns semantics.
included:
  - App
  - UITests
  - Packages
  - Project.swift
  - Tuist.swift
  - Tuist/Package.swift
excluded:
  - .build
  - Derived
  - "**/Derived"
  - Tuist/.build
  - Packages/SegueCore/.build
  - Packages/SegueUI/.build
  - Packages/SeguePersonalModules/.build
  - Packages/SegueVendorServices/.build
  - Packages/SegueAI/.build
  - "**/.build-*"
  - research

disabled_rules:
  # Formatting rules SwiftFormat already enforces (avoid the two tools fighting).
  - trailing_comma
  - opening_brace
  - vertical_parameter_alignment_on_call
  - todo

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - discouraged_none_name
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - fallthrough
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - local_doc_comment
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_swiftui_state
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - static_operator
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_whitespace_closing_braces
  - yoda_condition

line_length:
  warning: 100
  error: 120
  ignores_comments: false
  ignores_urls: true

identifier_name:
  min_length: 2
  excluded: [id, x, y]

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 50
  error: 100

nesting:
  type_level: 2

# URL boundary (WS2a 3.1) and, below it, any other repo-wide pattern rules.
custom_rules:
  segue_links_only:
    name: "SegueLinks only"
    regex: '(ryandsilva\.dev|apps\.apple\.com)'
    # WS2a 3.1: every site, support and App Store URL lives in SegueLinks. The E2E support
    # file mirrors the few it asserts in the workspace log (UI tests cannot import SegueUI).
    excluded:
      - 'Packages/SegueUI/Sources/SegueUI/App/SegueLinks\.swift$'
      - 'UITests/SegueCoreUXE2ETests\+Support\.swift$'
      - 'UITests/SegueServicesE2ETests\+Support\.swift$'
    message: "External URLs live only in SegueLinks.swift (WS2a 3.1)."
    severity: error
  # Vendor boundary (WS3 spec 3.1): only Packages/SegueVendorServices may know a hosted
  # vendor. The TelemetryDeck SDK names stay listed so it can never creep back in (R34).
  vendor_sdk_import:
    name: "Vendor SDK import"
    regex: '^\s*(@\w+(\([^)]*\))?\s+)*import\s+(TelemetryDeck|TelemetryClient|_?Sentry)'
    excluded: 'Packages/SegueVendorServices/'
    message: "Vendor SDKs are imported only in Packages/SegueVendorServices (WS3 spec 3.1)."
    severity: error
  # P9-4 spec 4.1: the Personal build's HTML parser is imported only in the personal
  # package's Web/ folder (and its tests), so it can never reach core, SegueUI or the App Store build.
  swiftsoup_import:
    name: "SwiftSoup import"
    regex: '^\s*(@\w+(\([^)]*\))?\s+)*import\s+SwiftSoup\b'
    excluded:
      - 'Packages/SeguePersonalModules/Sources/SeguePersonalModules/Web/'
      - 'Packages/SeguePersonalModules/Tests/'
    message: "SwiftSoup is imported only in SeguePersonalModules/Web (P9-4 spec 4.1)."
    severity: error
  vendor_host:
    name: "Vendor host"
    regex: '(telemetrydeck\.com|sentry\.io)'
    # The DSN build setting lives in Project.swift (spec 3.7); SegueLinks holds every URL.
    excluded:
      - 'Packages/SegueVendorServices/'
      - 'Packages/SegueUI/Sources/SegueUI/App/SegueLinks\.swift$'
      - '(^|/)Project\.swift$'
    message: "Vendor hosts are spelled only in Packages/SegueVendorServices (WS3 spec 3.1)."
    severity: error
