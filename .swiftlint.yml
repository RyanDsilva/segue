# SwiftLint - version pinned in .mise.toml. Runs in `make lint` / `make check`
# (not as an Xcode build phase). SwiftFormat owns formatting; SwiftLint owns semantics.
included:
  - App
  - UITests
  - Packages
  - Project.swift
  - Tuist.swift
  - Tuist/Package.swift
excluded:
  - .build
  - Derived
  - "**/Derived"
  - Tuist/.build
  - Packages/SegueCore/.build
  - Packages/SegueUI/.build
  - Packages/SeguePersonalModules/.build
  - Packages/SegueVendorServices/.build
  - "**/.build-*"
  - research

disabled_rules:
  # Formatting rules SwiftFormat already enforces (avoid the two tools fighting).
  - trailing_comma
  - opening_brace
  - vertical_parameter_alignment_on_call
  - todo

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - discouraged_none_name
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - fallthrough
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - local_doc_comment
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_swiftui_state
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - static_operator
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_whitespace_closing_braces
  - yoda_condition

line_length:
  warning: 100
  error: 120
  ignores_comments: false
  ignores_urls: true

identifier_name:
  min_length: 2
  excluded: [id, x, y]

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 50
  error: 100

nesting:
  type_level: 2
