# Tool versions for Segue. Install with `mise install` (or `make bootstrap`).
# Never install these globally; every Makefile target runs them via `mise exec --`.
[tools]
tuist = "4.212.0"
swiftlint = "0.65.1"
swiftformat = "0.64.0"
# Website tooling (WS4): uvx runs fonttools for the web fonts; pnpm dlx runs html-validate and wrangler.
uv = "0.13.1"
node = "26.12.0"
pnpm = "12.14.0"
# Repo hygiene (`make repo-check`, mirrored by the Linux CI in .github/workflows).
actionlint = "1.7.12"
shellcheck = "0.11.0"
jq = "1.8.2"
yq = "4.54.1"
# Guide clips (WS6 6, `make docs-clips`) and the App Store preview (WS5 9.4).
ffmpeg = "9.0.2"
# App Store text and screenshots upload (WS5 10, `make store-upload`): fastlane deliver.
ruby = "3.4.12"
"gem:fastlane" = "2.241.2"
# dSYM upload to Sentry in `make upload` / `make upload-dsyms` (WS3 6.5).
"aqua:getsentry/sentry-cli" = "3.8.0"
# Off-screen E2E (R180, docs/research/e2e-off-screen.md): the Tart VM runner behind
# `make e2e-vm` / E2E_RUNNER=vm. FSL-1.1-ALv2 (internal use allowed).
"aqua:cirruslabs/tart" = "2.41.1"
# Lume (MIT): the licence escape hatch behind the same runner switch (E2E_RUNNER=lume).
# Run `lume config telemetry disable` once after installing.
"github:trycua/cua" = { version = "lume-v0.6.1", asset_pattern = "lume-0.6.1-darwin-arm64.tar.gz", bin = "lume" }
