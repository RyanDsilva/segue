# Tool versions for Segue. Install with `mise install` (or `make bootstrap`).
# Never install these globally; every Makefile target runs them via `mise exec --`.
[tools]
tuist = "4.212.0"
swiftlint = "0.65.1"
swiftformat = "0.64.0"
# Website tooling (WS4): uvx runs fonttools for the web fonts; pnpm dlx runs html-validate and wrangler.
uv = "0.13.1"
node = "26.12.0"
pnpm = "12.14.0"
# Repo hygiene (`make repo-check`, mirrored by the Linux CI in .github/workflows).
actionlint = "1.7.12"
shellcheck = "0.11.0"
jq = "1.8.2"
yq = "4.54.1"
# dSYM upload to Sentry in `make upload` / `make upload-dsyms` (WS3 6.5).
"aqua:getsentry/sentry-cli" = "3.8.0"
