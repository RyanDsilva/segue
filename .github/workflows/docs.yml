# Docs and metadata checks: no em dashes, valid JSON and YAML, third-party notices that
# match the resolved package pins. Store metadata (store/, WS5) joins here once it exists.
name: Docs

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_EXEC_AUTO_INSTALL: "false"
  MISE_NOT_FOUND_AUTO_INSTALL: "false"

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.12
          install_args: jq yq
      - name: Docs and metadata (make docs-check)
        run: make docs-check
