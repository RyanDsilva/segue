# A vX.Y.Z tag creates the GitHub Release, with notes from the published changelog
# (website/changelog.json, generated from content/changelog.json). The tag must match
# MARKETING_VERSION and the release must be published (not draft) in the changelog, or this
# fails without creating anything. TestFlight and App Store uploads stay manual
# (docs/release/README.md, R13, R46). Preview locally: make release-notes TAG=vX.Y.Z
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

# Never cancel a release half-way; a second run for the same tag waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MISE_EXEC_AUTO_INSTALL: "false"
  MISE_NOT_FOUND_AUTO_INSTALL: "false"

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
          install_args: jq
      - name: Render notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mise exec -- scripts/release-notes.sh --title "$TAG" > "$RUNNER_TEMP/title.txt"
          mise exec -- scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag \
            --title "$(cat "$RUNNER_TEMP/title.txt")" \
            --notes-file "$RUNNER_TEMP/notes.md"
