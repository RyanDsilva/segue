# Lightweight Linux CI (docs/release/decisions.md R48). Builds and tests stay local under
# `make check`; `make repo-check` runs these same checks before a push.
name: Lint

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Install only what each job asks for; never the whole .mise.toml.
  MISE_EXEC_AUTO_INSTALL: "false"
  MISE_NOT_FOUND_AUTO_INSTALL: "false"

jobs:
  swift:
    name: Swift lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # SwiftLint on Linux loads libsourcekitdInProc.so from a Swift toolchain.
    container: swift:6.4-noble@sha256:19cbe56bdaec1918f7cf5fdeba42b9bd55bdd8a6149c9990d0e0e3a89a127d63
    steps:
      # The Swift image ships without a downloader; mise-action needs curl, and the
      # SwiftLint/SwiftFormat release assets need unzip and xz.
      - name: Install make and download tools
        run: >-
          apt-get update -qq && apt-get install -y -qq --no-install-recommends
          make curl ca-certificates unzip xz-utils git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
          install_args: swiftlint swiftformat
      - name: SwiftLint and SwiftFormat (make lint)
        run: make lint

  repo:
    name: Scripts and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
          install_args: shellcheck actionlint
      - name: ShellCheck (make shellcheck)
        run: make shellcheck
      - name: actionlint (make actionlint)
        run: make actionlint
